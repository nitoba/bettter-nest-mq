name: SQLite development verification
on:
  push:
    branches: [feat/sqlite-adapter]
permissions:
  contents: write
concurrency:
  group: sqlite-development
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/sqlite-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mq
          POSTGRES_PASSWORD: mq_test_only
          POSTGRES_DB: mq_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mq -d mq_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MQ_TEST_DATABASE_URL: postgresql://mq:mq_test_only@localhost:5432/mq_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply package integration and generate lockfile with Bun
        run: |
          if test -f .github/apply-sqlite.mjs; then
            node .github/apply-sqlite.mjs
            git rm .github/apply-sqlite.mjs
          fi
          bun install
          bun run format
          bun run check:tooling
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'feat: wire SQLite subpaths and generate the Bun dependency lock'
            git push origin HEAD:feat/sqlite-adapter
          fi
      - name: Verify SQLite regressions and minimum compiler
        run: |
          bun run typecheck
          bun run typecheck:minimum
          bun test tests/unit/sqlite-public-api.test.ts tests/integration/sqlite.test.ts
      - name: Verify all source and installed PostgreSQL/native SQLite consumers
        run: |
          bun run check > /tmp/sqlite-check.log 2>&1 || { tail -220 /tmp/sqlite-check.log; exit 1; }
          grep -E '^PASS| pass| fail|Packed consumers' /tmp/sqlite-check.log
