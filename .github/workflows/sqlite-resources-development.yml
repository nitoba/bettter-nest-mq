name: SQLite resource verification
on:
  push:
    branches: [feat/sqlite-resources]
permissions:
  contents: read
concurrency:
  group: sqlite-resource-development
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Verify explicit SQLite resource options
        run: bun test tests/unit/sqlite-resources-api.test.ts
      - name: Reproduce released schedule JSON behavior
        if: always()
        run: bun .github/probe-sqlite-schedules.mjs
      - name: Inspect pinned event and schedule declarations
        if: always()
        run: |
          for file in node_modules/better-effect-mq-sqlite/dist/*.d.mts; do
            echo "DECLARATION $file"
            sed -n '/interface SqliteJobEventStoreConfig/,+55p' "$file"
            sed -n '/declare const SqliteJobEventStore/,+55p' "$file"
          done
          git diff --exit-code
