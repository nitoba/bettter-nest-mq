name: SQLite resource verification
on:
  push:
    branches: [feat/sqlite-resources]
permissions:
  contents: read
concurrency:
  group: sqlite-resource-development
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run typecheck:minimum
      - name: Verify native event resources
        run: bun test tests/unit/sqlite-resources-api.test.ts tests/integration/sqlite-events.test.ts tests/integration/sqlite-event-lifecycle.test.ts
      - name: Build and verify lint
        if: always()
        run: bun run build && bun run lint
      - name: Inspect formatter differences
        if: always()
        run: |
          bun run format
          git diff --exit-code
          bun run check:tooling
      - name: Verify actual installed consumers
        run: bun run test:package
