name: Kysely integration qualification
on:
  push:
    branches: [feat/kysely-outbox]
permissions:
  contents: write
concurrency:
  group: kysely-development
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/feat/kysely-outbox'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mq
          POSTGRES_PASSWORD: mq_test_only
          POSTGRES_DB: mq_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mq -d mq_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MQ_TEST_DATABASE_URL: postgresql://mq:mq_test_only@localhost:5432/mq_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Generate optional integration lockfile with Bun and format authored files
        run: |
          node .github/setup-kysely.mjs
          git rm .github/setup-kysely.mjs .github/workflows/kysely-development.yml
          bun install --ignore-scripts
          bun run format
          bun run check:tooling
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'build: expose optional Kysely integration and record its Bun lockfile'
          git push origin HEAD:feat/kysely-outbox
      - name: Verify compiler and focused Kysely lifecycle regressions
        run: |
          bun run typecheck
          bun run typecheck:minimum
          bun test tests/unit/kysely-entrypoint.test.ts tests/unit/kysely-scope.test.ts
      - name: Full source and installed PostgreSQL consumer checks
        run: |
          bun run check > /tmp/kysely-check.log 2>&1 || { tail -220 /tmp/kysely-check.log; exit 1; }
          tail -15 /tmp/kysely-check.log
