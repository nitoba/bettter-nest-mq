name: Controls development validation

on:
  push:
    branches: [feat/distributed-controls]

permissions:
  contents: write

concurrency:
  group: controls-development
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/feat/distributed-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply checked integration patches and format authored code
        run: |
          node .github/apply-controls.mjs
          bun install --frozen-lockfile
          bun run format
          bun run check:tooling
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'feat: wire distributed controls into the existing runtime and publication boundaries'
            git push origin HEAD:feat/distributed-controls
          fi
      - name: Verify complete package quality gate
        run: bun run check
