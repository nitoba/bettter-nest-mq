name: Controls development inspection

on:
  push:
    branches: [feat/distributed-controls]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nitoba/better-effect
          ref: 42c28fb0af7882eb048ee5d4ab1c1db81142c9dd
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify regression against current execution baseline
        working-directory: project
        run: |
          bun install --frozen-lockfile
          bun test
      - name: Inspect actual controlled protocol and project contracts
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs'
          for (const path of ['README.md', 'docs/contracts.md', 'docs/connections.md', 'docs/execution.md', 'docs/architecture.md', 'docs/roadmap.md', '.oxlintrc.json', 'src/engine/job-compiler.ts', 'src/engine/mq-engine.host.ts']) {
            console.log(`\nPROJECT ${path}\n${readFileSync(`project/${path}`, 'utf8')}`)
          }
          for (const path of ['packages/better-effect-mq/src/worker/supervisor.ts', 'packages/better-effect-mq-postgres/src/store.ts', 'packages/better-effect-mq/src/store/memory.ts']) {
            const lines = readFileSync(`upstream/${path}`, 'utf8').split('\n')
            for (const term of ['getControls(', 'async reconcile(', 'async claim(', 'claimControlled(', 'settleControlled(', 'cancelControlled(']) {
              const index = lines.findIndex(line => line.includes(term))
              if (index >= 0) console.log(`\nUPSTREAM ${path}:${index + 1} ${term}\n${lines.slice(Math.max(0, index - 5), index + 90).join('\n')}`)
            }
          }
          for (const path of readdirSync('project/node_modules/better-effect-mq/dist').filter(file => /\.d\.(mts|ts)$/.test(file))) {
            const lines = readFileSync(`project/node_modules/better-effect-mq/dist/${path}`, 'utf8').split('\n')
            for (const term of ['interface ControlledJobStoreContract', 'interface QueueControlsRecord', 'interface QueueControlsRegistry']) {
              const index = lines.findIndex(line => line.includes(term))
              if (index >= 0) console.log(`\nPUBLISHED ${path}\n${lines.slice(index, index + 85).join('\n')}`)
            }
          }
          NODE
