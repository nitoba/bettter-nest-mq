name: Controls development validation

on:
  push:
    branches: [feat/distributed-controls]

permissions:
  contents: write

concurrency:
  group: controls-development
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/feat/distributed-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mq
          POSTGRES_PASSWORD: mq_test_only
          POSTGRES_DB: mq_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mq -d mq_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MQ_TEST_DATABASE_URL: postgresql://mq:mq_test_only@localhost:5432/mq_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply checked integration patches and format authored code
        run: |
          node .github/apply-controls.mjs
          node .github/qualify-controls.mjs
          bun install --frozen-lockfile
          bun run format
          bun run check:tooling
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'test: qualify distributed controls and format authored sources'
            git push origin HEAD:feat/distributed-controls
          fi
      - name: Verify full package and actual distributed PostgreSQL execution
        run: bun run check
