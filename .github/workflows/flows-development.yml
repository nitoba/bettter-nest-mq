name: Flow development validation

on:
  push:
    branches: [feat/durable-flows]

permissions:
  contents: write

concurrency:
  group: flows-development
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/feat/durable-flows'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mq
          POSTGRES_PASSWORD: mq_test_only
          POSTGRES_DB: mq_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mq -d mq_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MQ_TEST_DATABASE_URL: postgresql://mq:mq_test_only@localhost:5432/mq_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply reviewed refinement and retire its transport
        id: prepare
        run: |
          if test -f .github/flow-refinement.patch; then
            git apply --check .github/flow-refinement.patch
            git apply --index .github/flow-refinement.patch
            git rm .github/flow-refinement.patch
          fi
          bun install --frozen-lockfile
          bun run format
          bun run check:tooling
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'fix: harden flow identities and phase-owned result cursors'
            git push origin HEAD:feat/durable-flows
          fi
      - name: Verify types, Nest regressions and lint
        run: |
          bun run typecheck
          bun run typecheck:minimum
          bun test > /tmp/flow-unit.log 2>&1 || { cat /tmp/flow-unit.log; exit 1; }
          tail -6 /tmp/flow-unit.log
          bun run format:check
          bun run build
          bun run lint
          bun run publint
      - name: Diagnose actual installed flow scenarios first
        if: always() && steps.prepare.outcome == 'success'
        run: |
          bun run build
          node .github/verify-flows.mjs
      - name: Retain full PostgreSQL package regression matrix
        run: |
          bun run test:package > /tmp/flow-packages.log 2>&1 || { tail -180 /tmp/flow-packages.log; exit 1; }
          grep '^PASS\|Packed consumers passed' /tmp/flow-packages.log
