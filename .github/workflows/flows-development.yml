name: Flow development harness

on:
  push:
    branches: [feat/durable-flows]

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nitoba/better-effect
          ref: 42c28fb0af7882eb048ee5d4ab1c1db81142c9dd
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Prepare pinned offline development inputs
        run: |
          cd project
          bun install --frozen-lockfile
          bun run check:tooling
          cd ..
          mkdir -p harness/bin artifacts
          cp "$(command -v bun)" harness/bin/bun
          cp "$(command -v node)" harness/bin/node
          tar --exclude=.git -czf artifacts/flow-harness.tar.gz project upstream/packages harness
      - uses: actions/upload-artifact@v4
        with:
          name: flow-development-harness
          path: artifacts/flow-harness.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
