name: PostgreSQL JSON validation

on:
  push:
    branches: [fix/postgres-json-fidelity]

permissions:
  contents: write

concurrency:
  group: json-development
  cancel-in-progress: false

jobs:
  regression:
    if: github.ref == 'refs/heads/fix/postgres-json-fidelity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mq
          POSTGRES_PASSWORD: mq_test_only
          POSTGRES_DB: mq_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mq -d mq_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MQ_TEST_DATABASE_URL: postgresql://mq:mq_test_only@localhost:5432/mq_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Format authored files with the exact upstream rules
        run: |
          bun install --frozen-lockfile
          bun run format
          bun run check:tooling
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply upstream formatting to JSON fidelity regression and fix'
            git push origin HEAD:fix/postgres-json-fidelity
          fi
      - name: Check actual PostgreSQL JSON regression
        run: bun tests/postgres/json-fidelity.ts
      - name: Verify full package and retained regressions
        run: bun run check
