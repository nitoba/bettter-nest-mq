name: Execution development validation

on:
  push:
    branches: [feat/producers-workers]

permissions:
  contents: write

concurrency:
  group: execution-development
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/feat/producers-workers'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Update obsolete contract-only API assertions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          for (const file of ['tests/unit/schema-contracts.test.ts', 'tests/integration/queue-registration.test.ts']) {
            const text = readFileSync(file, 'utf8').replace(/(expect\('enqueue' in [^\n]+\)\.toBe\()false(\))/, '$1true$2')
            writeFileSync(file, text)
          }
          const types = 'tests/types/contracts.types.ts'
          writeFileSync(types, readFileSync(types, 'utf8').replace('  // @ts-expect-error The engine-backed producer API is not a simulated stub in M1.\n', ''))
          const registration = 'tests/integration/worker-registration.test.ts'
          writeFileSync(registration, readFileSync(registration, 'utf8').replace('Scope, UsePipes, ValidationPipe', 'Scope, UsePipes').replace('new ValidationPipe()', '{ transform(value: string) { return value } }'))
          NODE
      - name: Install and format using the unchanged upstream configuration
        run: |
          bun install --frozen-lockfile
          bun run format
          bun run check:tooling
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply upstream formatting and update supported API regressions'
            git push origin HEAD:feat/producers-workers
          fi
      - name: Verify full package quality gate
        run: bun run check
