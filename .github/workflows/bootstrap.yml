name: Initialize pinned tooling

on:
  push:
    branches: [chore/bootstrap]
    paths: [package.json, .github/workflows/bootstrap.yml]

permissions:
  contents: write

concurrency:
  group: initialize-tooling
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/bootstrap
          path: project
      - uses: actions/checkout@v4
        with:
          repository: nitoba/better-effect
          ref: 42c28fb0af7882eb048ee5d4ab1c1db81142c9dd
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Copy the exact upstream lint and formatter configuration
        working-directory: project
        run: |
          set -euo pipefail
          cp ../upstream/.oxlintrc.json ../upstream/.oxfmtrc.json .
          mkdir -p tools
          cp -R ../upstream/tools/oxlint tools/
          cp ../upstream/LICENSE .
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { writeFileSync } from 'node:fs'
          const paths = ['.oxlintrc.json', '.oxfmtrc.json', 'tools/oxlint']
          const rows = execFileSync('git', ['-C', '../upstream', 'ls-files', '-s', '--', ...paths], { encoding: 'utf8' }).trim().split('\n')
          const files = rows.map(row => {
            const [metadata, path] = row.split('\t')
            return { path, gitBlob: metadata.split(' ')[1] }
          })
          writeFileSync('tools/upstream-tooling.json', JSON.stringify({ repository: 'nitoba/better-effect', commit: '42c28fb0af7882eb048ee5d4ab1c1db81142c9dd', files }, null, 2) + '\n')
          NODE
      - name: Install with Bun and generate the real lockfile
        working-directory: project
        run: |
          bun install
          bun run format
          bun --version
          node node_modules/typescript/bin/tsc --version
          node node_modules/typescript-minimum/bin/tsc --version
      - name: Commit generated tooling and lockfile to the bootstrap branch only
        working-directory: project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock .oxlintrc.json .oxfmtrc.json tools LICENSE .github/workflows/bootstrap.yml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: vendor upstream tooling and lock Bun dependencies'
            git push origin HEAD:chore/bootstrap
          fi
