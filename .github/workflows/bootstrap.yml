name: Bootstrap validation

on:
  push:
    branches: [chore/bootstrap]

permissions:
  contents: write

concurrency:
  group: bootstrap-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Normalize authored files with the upstream formatter
        run: |
          bun run format
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply upstream Oxfmt configuration'
            git push origin HEAD:chore/bootstrap
          fi
      - name: Validate the complete package
        run: bun run check
