name: Bootstrap validation

on:
  push:
    branches: [chore/bootstrap]

permissions:
  contents: write

concurrency:
  group: bootstrap-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/bootstrap
          path: project
      - uses: actions/checkout@v4
        with:
          repository: nitoba/better-effect
          ref: 42c28fb0af7882eb048ee5d4ab1c1db81142c9dd
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Restore the exact upstream tooling and exclude vendored source from formatting
        run: |
          cp ../upstream/.oxlintrc.json ../upstream/.oxfmtrc.json .
          cp -R ../upstream/tools/oxlint/. tools/oxlint/
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          pkg.scripts.format = "oxfmt --write . '!tools/oxlint/**'"
          pkg.scripts['format:check'] = "oxfmt --check . '!tools/oxlint/**'"
          writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Normalize authored files with the upstream formatter
        run: |
          bun run format
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve upstream tooling and format project sources'
            git push origin HEAD:chore/bootstrap
          fi
      - name: Validate the complete package
        run: bun run check
