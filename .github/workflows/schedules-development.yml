name: Schedule development validation

on:
  push:
    branches: [feat/durable-schedules]

permissions:
  contents: write

concurrency:
  group: schedules-development
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/feat/durable-schedules'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply checked compatibility fixes and format authored sources
        run: |
          node .github/wire-schedules.mjs
          node .github/schedule-compatibility.mjs
          bun install --frozen-lockfile
          bun run format
          bun run check:tooling
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve schedule generics and apply upstream formatting'
            git push origin HEAD:feat/durable-schedules
          fi
      - name: Run complete quality gate
        run: bun run check
