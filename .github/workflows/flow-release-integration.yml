name: Flow release integration

on:
  push:
    branches: [feat/durable-flows]

permissions:
  contents: write

concurrency:
  group: flow-release-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/durable-flows'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mq
          POSTGRES_PASSWORD: mq_test_only
          POSTGRES_DB: mq_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mq -d mq_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MQ_TEST_DATABASE_URL: postgresql://mq:mq_test_only@localhost:5432/mq_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Resolve the released engine versions and regenerate lockfile
        run: |
          bun install
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const mq = JSON.parse(readFileSync('node_modules/better-effect-mq/package.json', 'utf8'))
          const pg = JSON.parse(readFileSync('node_modules/better-effect-mq-postgres/package.json', 'utf8'))
          assert.equal(mq.version, '0.1.3')
          assert.equal(pg.version, '0.1.4')
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(manifest.dependencies['better-effect-mq'], '0.1.3')
          assert.equal(manifest.dependencies['better-effect-mq-postgres'], '0.1.4')
          assert.equal(manifest.peerDependencies?.['better-effect-mq'], undefined)
          assert.equal(manifest.peerDependencies?.['better-effect-mq-postgres'], undefined)
          console.log('RELEASED ENGINE', mq.version, 'POSTGRES', pg.version)
          NODE
      - name: Run tooling and complete Nest quality gate
        run: |
          bun run check:tooling
          bun run check
      - name: Run real PostgreSQL regression suite
        run: bun run test:postgres
      - name: Commit only the resolved dependency lock and retire this temporary workflow
        run: |
          git rm .github/workflows/flow-release-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock package.json .github/workflows/flow-release-integration.yml
          git diff --cached --check
          git commit -m 'chore: lock released MQ flow engine versions'
          git push origin HEAD:feat/durable-flows
