name: Isolated development toolchain

on:
  push:
    branches: [work]
    paths: ['.github/workflows/dev-toolchain.yml']

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Verify unchanged baseline
        run: bun run check
      - name: Pack only public installed dependencies and execution binaries
        run: |
          mkdir -p tooling
          cp "$(command -v bun)" tooling/bun
          cp "$(command -v node)" tooling/node
          tar -czf /tmp/mq-toolchain.tgz node_modules tooling
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-mq-toolchain
          path: /tmp/mq-toolchain.tgz
          retention-days: 1
