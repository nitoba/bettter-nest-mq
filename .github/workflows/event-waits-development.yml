name: Finalize event wait documentation
on:
  push:
    branches: [feat/event-result-waits]
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/feat/event-result-waits'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Remove obsolete scope claims and all temporary development tools
        run: |
          bun .github/finalize-event-docs.mjs
          git rm .github/finalize-event-docs.mjs .github/workflows/event-waits-development.yml
          bun install --frozen-lockfile
          bun run format
          bun run check:tooling
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'docs: finalize event wait semantics and restore read-only CI'
          git push origin HEAD:feat/event-result-waits
      - name: Confirm source gate after documentation cleanup
        run: |
          bun run typecheck
          bun run typecheck:minimum
          bun test
          bun run format:check
          bun run build
          bun run lint
          bun run publint
