name: Outbox retry development
on:
  push:
    branches: [feat/outbox-failed-retry]
permissions:
  contents: write
concurrency:
  group: outbox-retry-development
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/outbox-failed-retry'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mq
          POSTGRES_PASSWORD: mq_test_only
          POSTGRES_DB: mq_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mq -d mq_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MQ_TEST_DATABASE_URL: postgresql://mq:mq_test_only@localhost:5432/mq_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply checked exports and format authored code
        run: |
          if test -f .github/apply-outbox-retry.mjs; then
            node .github/apply-outbox-retry.mjs
            git rm .github/apply-outbox-retry.mjs
          fi
          bun install --frozen-lockfile
          bun run format
          bun run check:tooling
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'feat: wire guarded outbox retry and format sources'
            git push origin HEAD:feat/outbox-failed-retry
          fi
      - name: Verify source, declarations and actual package consumers
        run: |
          bun run check > /tmp/outbox-check.log 2>&1 || { tail -180 /tmp/outbox-check.log; exit 1; }
          grep -E '^PASS| pass| fail|Packed consumers' /tmp/outbox-check.log
