name: Format SQLite outbox delivery
on:
  push:
    branches: [feat/sqlite-outbox]
permissions:
  contents: write
concurrency:
  group: sqlite-outbox-format
  cancel-in-progress: false
jobs:
  format:
    if: github.ref == 'refs/heads/feat/sqlite-outbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Apply repository formatter and remove this one-shot workflow
        run: |
          bun run format
          bun run check:tooling
          git rm .github/workflows/sqlite-outbox-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git commit -m 'style: format SQLite outbox delivery'
          git push origin HEAD:feat/sqlite-outbox
